<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>My Todo</h1>
        </header>

        <section class="calendar-section">
            <div class="calendar-header">
                <button id="prev-week-btn" class="icon-btn">&lt;</button>
                <h2 id="current-month-display">2026년 6월</h2>
                <button id="next-week-btn" class="icon-btn">&gt;</button>
            </div>
            <div class="week-days" id="week-days"></div>
        </section>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행 중</button>
            <button class="filter-btn" data-filter="completed">완료</button>
        </div>

        <section class="input-section">
            <input type="text" id="todo-input" placeholder="선택한 날짜에 할 일을 추가하세요">
            <button id="add-btn">추가</button>
        </section>

        <ul id="todo-list"></ul>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
